<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Homido GRAB WebVR Interactive</title>
    <!-- A-Frame Library -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene embedded vr-mode-ui="enabled: true">
      <!-- Asset Management -->
      <a-assets>
        <audio id="pop-sound" src="https://cdn.aframe.io/360-image-gallery-boilerplate/audio/click.ogg" response-type="arraybuffer" crossorigin="anonymous"></audio>
      </a-assets>

      <!-- Environment -->
      <a-sky color="#111827"></a-sky>
      <a-ambient-light color="#666666"></a-ambient-light>
      <a-directional-light position="-1 2 1" intensity="0.8"></a-directional-light>

      <!-- Camera Rig with Spatial Listener -->
      <a-entity id="rig" position="0 1.6 0">
        <a-camera look-controls sound="positional: true">
          <a-cursor
            id="cursor"
            raycaster="objects: .clickable"
            color="#FFFFFF"
            position="0 0 -1"
            geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03"
            animation__click="property: scale; startEvents: click; dur: 150; from: 0.1 0.1 0.1; to: 1 1 1">
          </a-cursor>
        </a-camera>
      </a-entity>

      <!-- Interactive Box (Color Change & Sound) -->
      <a-box
        class="clickable"
        position="-1.5 1.5 -3"
        rotation="0 45 0"
        color="#3B82F6"
        sound="src: #pop-sound; on: click; poolSize: 2"
        change-color>
      </a-box>

      <!-- Interactive Sphere (Scale Bump & Sound) -->
      <a-sphere
        class="clickable"
        position="1.5 1.5 -3"
        radius="0.8"
        color="#EF4444"
        sound="src: #pop-sound; on: click; poolSize: 2"
        pulse-on-click>
      </a-sphere>

      <!-- Ground Plane -->
      <a-plane position="0 0 -4" rotation="-90 0 0" width="10" height="10" color="#1F2937"></a-plane>
    </a-scene>

    <!-- Custom Interaction Scripts -->
    <script>
      // Component 1: Changes object color randomly on click/tap
      AFRAME.registerComponent('change-color', {
        init: function () {
          const colors = ['#10B981', '#F59E0B', '#8B5CF6', '#EC4899', '#3B82F6'];
          this.el.addEventListener('click', () => {
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            this.el.setAttribute('color', randomColor);
          });
        }
      });

      // Component 2: Triggers a scale pulse animation on click/tap
      AFRAME.registerComponent('pulse-on-click', {
        init: function () {
          this.el.addEventListener('click', () => {
            this.el.setAttribute('animation', {
              property: 'scale',
              to: '1.3 1.3 1.3',
              dur: 150,
              dir: 'alternate',
              loop: 2
            });
          });
        }
      });
    </script>
  </body>
</html>
